version: 1
scope: "Source paths resolve from repository root; URLs remain mutable."
rules:
  - instruction: "Use current tool schemas rather than guessing fields or relying on a copied catalog."
    sources: [tool-contracts, server]
    locator: "extendMcpTools and typed tools definitions"
  - instruction: "Model coordinates are millimetres."
    sources: [server]
    locator: "MCP initialize instructions"
  - instruction: "Ask which editor when the target is ambiguous."
    sources: [server]
    locator: "host(args) rejects multiple editors without editorId"
  - instruction: "An imported STL remains a mesh."
    sources: [modeling-contract]
    locator: "Imported meshes and resize limitations"
  - instruction: "Apply only the successful `previewId` using `jumpstart_apply_model` against the same editor."
    sources: [server, modeling-contract]
    locator: "apply_model dispatch and preview/apply revision guards"
  - instruction: "Never claim physical fit from an image, nominal product size, or a successful mesh export."
    sources: [user-workflow, modeling-contract]
    locator: "Spacer assumptions, frame inspection limits, fit requirements"
  - instruction: "Never bypass the MCP transport through raw HTTP, arbitrary JavaScript, or UI clicks."
    sources: [user-workflow]
    locator: "Explicit MCP-only modeling scope and local validated operations"
  - instruction: "Native parameters and MCP template parameters are separate systems."
    sources: [modeling-contract]
    locator: "Native 2.0 compatibility"
  - instruction: "Its persisted recipe is editable mesh generation, not a sketch-based CAD feature tree."
    sources: [modeling-contract]
    locator: "Native 2.0 compatibility; Lathe recipe semantics"
  - instruction: "For repeated existing features, use `featurePattern` only for holes, planar embosses, and sketch-backed extrude/revolve/sweep booleans."
    sources: [server, model-plan, modeling-contract]
    locator: "featurePattern schema and patternableFeature validation"
  - instruction: "Straight bevel gears are a conical loft approximation and do not establish tooth-contact accuracy."
    sources: [server, modeling-contract]
    locator: "Native straight-bevel gear operation limitations"
  - instruction: "Import only by asset id from jumpstart_list_imports; do not pass host paths or file contents through model plans."
    sources: [server, managed-imports, modeling-contract]
    locator: "Managed read-only imports directory and typed digest references"
